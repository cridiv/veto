# ------------------------------------------------------------------------------
# Veto Security Policies Reference
# Top-to-bottom evaluation. First match wins.
# ------------------------------------------------------------------------------

context:
  known_recipients:
    - "PHCN"
    - "Supplier Ltd"
    - "Amazon Web Services"

policies:

  # 1. Allow read-only operations for all agents
  - name: allow-read-tools
    description: "Allow read queries with zero friction"
    match:
      agents: ["*"]
      tools:
        - read_inbox
        - read_file
        - list_files
        - get_balance
        - read_article
    action: allow

  # 2. Allow outbound reports ONLY to authorized internal corporate destinations
  - name: allow-internal-reports
    description: "Allow dispatching reports to approved internal corporate endpoints"
    match:
      agents: ["*"]
      tools: [send_report]
    when: 'args.destination startswith "https://internal.acme.com/"'
    action: allow

  # 3. Block unauthorized outbound exfiltration of reports to external sinks
  - name: block-external-data-exfiltration
    description: "Prevent data exfiltration to unapproved external endpoints"
    match:
      agents: ["*"]
      tools: [send_report]
    when: 'not args.destination startswith "https://internal.acme.com/"'
    action: block

  # 4. Hourly spending cap for Acme Assistant
  - name: acme-hourly-transfer-cap
    description: "Limit cumulative transfers to ₦300,000 per hour"
    match:
      agents: [acme-assistant]
      tools: [transfer_money]
    quota:
      window: 1h
      sum: args.amount
      max: 300000
    action: require_approval

  # 5. Require human approval on large single transfers
  - name: acme-large-transfers
    description: "Require approval for single transfers exceeding ₦100,000"
    match:
      agents: [acme-assistant]
      tools: [transfer_money]
    when: "args.amount > 100000"
    action: require_approval

  # 6. Require approval for new / unverified recipients
  - name: acme-unverified-recipients
    description: "Require approval when sending funds to unlisted accounts"
    match:
      agents: [acme-assistant]
      tools: [transfer_money]
    when: "args.to not in context.known_recipients"
    action: require_approval

  # 7. Allow standard transfers to verified recipients under single-transfer threshold
  - name: acme-verified-transfers
    description: "Allow small transfers to known recipients with zero friction"
    match:
      agents: [acme-assistant]
      tools: [transfer_money]
    when: "args.to in context.known_recipients"
    action: allow

  # 8. Prevent file deletions outside sandbox
  - name: block-sandbox-escape-deletion
    description: "Prevent destructive file deletions outside permitted workspace"
    match:
      tools: [delete_files]
    when: 'not args.path startswith "/workspace/"'
    action: block

  # 9. Rate-limit file deletions for DevOps / CI bot
  - name: devops-deletion-rate-limit
    description: "Limit deletions to at most 3 calls per 10 minutes"
    match:
      agents: [devops-bot, ci-bot]
      tools: [delete_files]
    quota:
      window: 10m
      count: 3
    action: block

  # 10. Allow workspace deletions within rate limit
  - name: devops-allow-workspace-deletion
    description: "Allow DevOps and CI bots to clean workspace temp files within rate limit"
    match:
      agents: [devops-bot, ci-bot]
      tools: [delete_files]
    when: 'args.path startswith "/workspace/"'
    action: allow

  # 11. Zero-Trust Default-Deny: Any tool not explicitly whitelisted above is blocked
  - name: default-deny-unwhitelisted-actions
    description: "Zero-Trust default: Block any tool call not explicitly whitelisted"
    match:
      tools: ["*"]
    action: block
